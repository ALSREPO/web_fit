{% extends "base.html" %}

{% block title %}{{ ejercicio }} - Histórico{% endblock %}

{% block content %}
<div class="space-y-4">
    <!-- Volver -->
    <a href="/ejercicios" class="inline-flex items-center text-xs font-medium text-blue-400 hover:text-blue-300">
        ← Volver al listado
    </a>

    <!-- Cabecera con Selector Desplegable -->
    <header class="rounded-2xl border border-slate-700/60 bg-slate-800/90 p-5 shadow-md">
        <p class="text-xs font-medium uppercase tracking-wider text-slate-400">Histórico de Ejercicio</p>

        <div class="relative mt-2">
            <select
                onchange="if(this.value) window.location.href='/ejercicios/' + encodeURIComponent(this.value)"
                class="w-full appearance-none rounded-xl border border-slate-700/80 bg-slate-900/90 py-2 pl-3 pr-8 text-xl font-bold text-white shadow-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 cursor-pointer"
            >
                <option value="{{ ejercicio }}" selected>{{ ejercicio }}</option>
                {% for ex in exercisesList %}
                    {% set name = ex.nombre %}
                    {% if name != ejercicio %}
                        <option value="{{ name }}">{{ name }}</option>
                    {% endif %}
                {% endfor %}
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-400">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </div>
        </div>
    </header>

    <!-- Tarjetas de Estadísticas (Fuerza o Cardio con proyecciones) -->
    {% include "ejercicios/partials/stats_cards.html" %}

    <!-- Sección Histórico de Sesiones -->
    <section class="rounded-2xl border border-slate-700/60 bg-slate-800/90 p-4 shadow-md">
        <h3 class="mb-3 text-base font-semibold text-white">Histórico de sesiones</h3>

        <div id="sessions-container" class="space-y-4">
            {% include "ejercicios/partials/session_rows.html" %}
        </div>
    </section>
</div>
{% endblock %}
