<!-- app/templates/index.html -->
 
{% extends "base.html" %}

{% block title %}Panel Principal - Diario de Hierro{% endblock %}

{% block content %}
<div class="space-y-4">
    <h2 class="text-xl font-bold text-white">Panel Principal</h2>

    <!-- 1. Próximo Entrenamiento -->
    <div hx-get="/api/v1/dashboard/fragment/next-workout" hx-trigger="load">
        <section class="rounded-2xl border border-slate-700/60 bg-slate-800/90 p-5 shadow-md animate-pulse">
            <div class="h-5 w-1/2 rounded bg-slate-700 mb-2"></div>
            <div class="h-6 w-3/4 rounded bg-slate-700"></div>
        </section>
    </div>

    <!-- 2. Último Entrenamiento -->
    <div hx-get="/api/v1/dashboard/fragment/last-workout" hx-trigger="load">
        <section class="rounded-2xl border border-slate-700/60 bg-slate-800/90 p-5 shadow-md animate-pulse">
            <div class="h-5 w-1/2 rounded bg-slate-700 mb-2"></div>
            <div class="h-6 w-3/4 rounded bg-slate-700"></div>
        </section>
    </div>

    <!-- 3. Resumen General con KPIs y Gráfico -->
    <div hx-get="/api/v1/dashboard/fragment/summary-kpis?period=week" hx-trigger="load">
        <section class="rounded-2xl border border-slate-700/60 bg-slate-800/90 p-5 shadow-md space-y-6 animate-pulse" id="summary-card-container">
            <div class="h-6 w-1/3 rounded bg-slate-700"></div>
            <div class="grid grid-cols-2 gap-3">
                <div class="h-20 rounded bg-slate-700/50"></div>
                <div class="h-20 rounded bg-slate-700/50"></div>
            </div>
        </section>
    </div>

    <!-- 4. Calendario Compacto -->
    <div hx-get="/api/v1/dashboard/fragment/calendar" hx-trigger="load">
        <section class="rounded-2xl border border-slate-700/60 bg-slate-800/90 p-5 shadow-md animate-pulse">
            <div class="h-5 w-1/3 rounded bg-slate-700 mb-4"></div>
            <div class="h-48 w-full rounded bg-slate-700/50"></div>
        </section>
    </div>
</div>
{% endblock %}
