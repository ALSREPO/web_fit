    <!-- Cabecera Superior Minimalista -->
    <header class="fixed top-0 left-0 right-0 px-4 h-16 border-b border-slate-800 bg-slate-900/95 backdrop-blur z-10">
        <div class="max-w-md mx-auto h-full flex justify-between items-center">
            
            <!-- Bloque Izquierdo: Logo y Título en una sola línea -->
            <div class="flex items-center">
                <a href="/" class="flex items-center gap-2 group transition-opacity hover:opacity-90 whitespace-nowrap">
                    <svg class="h-6 w-6 text-blue-500 transition-transform group-hover:scale-110 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10v4m2-5v6m2-7v8m10-8v8m2-7v6m2-5v4M7 12h10" />
                    </svg>
                    <h1 class="font-bold text-sm sm:text-base text-slate-100 group-hover:text-blue-400 transition-colors">
                        Diario de Hierro
                    </h1>
                </a>
            </div>

            <!-- Bloque Central: Badge de Entorno -->
            <div class="flex items-center justify-center">
                {% if entorno == "DEVELOP" %}
                    <span class="text-xs bg-red-950 text-red-400 px-2 py-0.5 rounded-full border border-red-800/60 font-mono font-semibold">
                        DEV
                    </span>
                {% elif entorno == "STAGING" %}
                    <span class="text-xs bg-amber-950 text-amber-400 px-2 py-0.5 rounded-full border border-amber-800/60 font-mono font-semibold">
                        PRE
                    </span>
                {% endif %}
            </div>

            <!-- Bloque Derecho: Botones o Usuario -->
            <div class="flex items-center justify-end gap-1.5">
                {% if not user %}
                    <a href="/login" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-2 py-1.5 rounded-xl border border-slate-700 transition-colors whitespace-nowrap">
                        Entrar
                    </a>
                    <a href="/registro" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-medium px-2 py-1.5 rounded-xl transition-colors shadow-sm whitespace-nowrap">
                        Registro
                    </a>
                {% else %}
                    <a href="/perfil" class="text-xs text-slate-300 hover:text-white font-medium truncate max-w-[100px]">
                        👤 {{ user.nombre }}
                    </a>
                {% endif %}
            </div>

        </div>
    </header>
