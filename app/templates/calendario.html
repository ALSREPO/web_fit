<!-- app/templates/calendario.html -->

{% extends "base.html" %}

{% block title %}Calendario - Diario de Hierro{% endblock %}

{% block content %}
<div class="space-y-4">
    <h2 class="text-xl font-bold text-white">Calendario</h2>
    <p class="text-sm text-slate-400">Pulsa un día para ver el detalle de la sesión.</p>
    
    <!-- Carga exactamente el mismo bloque que la página principal mediante HTMX -->
    <div hx-get="/api/v1/dashboard/fragment/calendar" hx-trigger="load">
        <section class="rounded-2xl border border-slate-700/60 bg-slate-800/90 p-5 shadow-md animate-pulse">
            <div class="h-5 w-1/3 rounded bg-slate-700 mb-4"></div>
            <div class="h-48 w-full rounded bg-slate-700/50"></div>
        </section>
    </div>
</div>
{% endblock %}
