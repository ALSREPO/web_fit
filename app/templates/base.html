<!-- app/templates/base.html -->
<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Diario de Hierro{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX para interactividad dinámica -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Favicon para la pestaña del navegador y marcadores -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Manifiesto de la PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111827">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col antialiased selection:bg-blue-500 selection:text-white">
    
    <!-- Cabecera -->
    {% include "partials/navbar.html" %}

    <!-- Contenido Principal -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full pt-20 {% if user %}pb-24{% else %}pb-12{% endif %}">
        {% block content %}{% endblock %}
    </main>

    <!-- Navegación Inferior (BottomNav) - Solo se muestra si el usuario está logueado -->
    {% include "partials/botones_navegacion.html" %}

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
            console.log('Service Worker registrado correctamente:', reg.scope);
            })
            .catch((err) => {
            console.error('Error al registrar el Service Worker:', err);
            });
        });
    }
    </script>

</body>
</html>
