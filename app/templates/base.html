<!-- app/templates/base.html -->
 
<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Diario de Hierro{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX para interactividad dinámica -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Favicon para la pestaña del navegador y marcadores -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Manifiesto de la PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111827">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col antialiased selection:bg-blue-500 selection:text-white">
    
    <!-- Cabecera Superior Minimalista -->
    <header class="fixed top-0 left-0 right-0 p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur z-10 flex justify-between items-center">
        <a href="/" class="flex items-center gap-2 group transition-opacity hover:opacity-90">
            <!-- Icono SVG de Barra Olímpica Sólida -->
            <svg class="h-6 w-6 text-blue-500 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10v4m2-5v6m2-7v8m10-8v8m2-7v6m2-5v4M7 12h10" />
            </svg>
            <h1 class="font-bold text-lg text-slate-100 group-hover:text-blue-400 transition-colors">
                Diario de Hierro
            </h1>
        </a>

        <!-- Badge dinámico según el entorno -->
        {% if entorno == "DEVELOP" %}
            <span class="text-xs bg-red-950 text-red-400 px-2.5 py-1 rounded-full border border-red-800/60 font-mono font-semibold">
                DEV
            </span>
        {% elif entorno == "STAGING" %}
            <span class="text-xs bg-amber-950 text-amber-400 px-2.5 py-1 rounded-full border border-amber-800/60 font-mono font-semibold">
                PRE
            </span>
        {% else %}
            <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded-full border border-slate-700 font-mono">
                ALS
            </span>
        {% endif %}
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full pt-20 pb-24">
        {% block content %}{% endblock %}
    </main>

    <!-- Navegación Inferior (BottomNav) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 backdrop-blur z-50">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <!-- Inicio -->
            <a href="/" class="flex flex-col items-center justify-center w-full h-full text-xs transition-colors {% if request.url.path == '/' %}text-blue-500 font-semibold{% else %}text-slate-400 hover:text-slate-200{% endif %}">
                <svg class="h-5 w-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span>Inicio</span>
            </a>

            <!-- Calendario -->
            <a href="/calendario" class="flex flex-col items-center justify-center w-full h-full text-xs transition-colors {% if request.url.path.startswith('/calendario') %}text-blue-500 font-semibold{% else %}text-slate-400 hover:text-slate-200{% endif %}">
                <svg class="h-5 w-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <span>Calendario</span>
            </a>

            <!-- Ejercicios -->
            <a href="/ejercicios" class="flex flex-col items-center justify-center w-full h-full text-xs transition-colors {% if request.url.path.startswith('/ejercicios') %}text-blue-500 font-semibold{% else %}text-slate-400 hover:text-slate-200{% endif %}">
                <svg class="h-5 w-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10v4m2-5v6m2-7v8m10-8v8m2-7v6m2-5v4M7 12h10"/>
                </svg>
                <span>Ejercicios</span>
            </a>

            <!-- Admin -->
            <a href="/admin" class="flex flex-col items-center justify-center w-full h-full text-xs transition-colors {% if request.url.path.startswith('/admin') %}text-blue-500 font-semibold{% else %}text-slate-400 hover:text-slate-200{% endif %}">
                <svg class="h-5 w-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <span>Admin</span>
            </a>
        </div>
    </nav>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
            console.log('Service Worker registrado correctamente:', reg.scope);
            })
            .catch((err) => {
            console.error('Error al registrar el Service Worker:', err);
            });
        });
    }
    </script>

</body>
</html>
